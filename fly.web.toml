# Public surface: embedded Shopify admin, widget chat API, all webhooks.
app = 'bit-concierge-web'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'
  NODE_ENV = 'production'

[processes]
  app = 'node apps/web/build/server/index.js'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    soft_limit = 200
    hard_limit = 250

[[vm]]
  size = 'shared-cpu-2x'
  memory = '1gb'
